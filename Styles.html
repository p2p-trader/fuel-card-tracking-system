<style>
:root{
  --brand:#2563eb; --bg:#f4f6f8; --surface:#ffffff; --surface2:#eef1f4; --text:#17202a;
  --muted:#5d6d7e; --border:#d5dbdb; --danger:#c0392b; --danger-bg:#fdedec;
  --ok:#1e8449; --ok-bg:#eafaf1; --warn:#b7950b; --warn-bg:#fef9e7; --radius:10px;
}
html[data-theme="dark"]{
  --bg:#12161c; --surface:#1b212b; --surface2:#232b38; --text:#e8edf3;
  --muted:#9fb0c3; --border:#333f52; --danger-bg:#3a2326; --ok-bg:#17352a; --warn-bg:#3a3319;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
button{cursor:pointer;font:inherit}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);width:100%}
label{font-size:13px;color:var(--muted);display:block;margin:0 0 4px}
.btn{background:var(--brand);color:#fff;border:none;padding:10px 16px;border-radius:8px;font-weight:bold}
.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn.danger{background:var(--danger)}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:wait}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:16px}
.grid{display:grid;gap:16px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:bold}
.badge.red{background:var(--danger-bg);color:var(--danger)}
.badge.green{background:var(--ok-bg);color:var(--ok)}
.badge.amber{background:var(--warn-bg);color:var(--warn)}
.badge.grey{background:var(--surface2);color:var(--muted)}
.bar{height:10px;background:var(--surface2);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand)}
.bar>i.low{background:var(--danger)}
.big{font-size:26px;font-weight:bold}
.muted{color:var(--muted)} .small{font-size:13px}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.mt{margin-top:12px} .mb{margin-bottom:12px}
.field{margin-bottom:12px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.checks label{display:flex;gap:8px;align-items:center;color:var(--text);font-size:14px;background:var(--surface2);padding:8px;border-radius:8px}
.checks input{width:auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:8px;display:none;z-index:99;max-width:92vw;text-align:center}
#toast.err{background:var(--danger);color:#fff}
/* layout */
#appLayout{display:none}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:230px;background:var(--surface);border-right:1px solid var(--border);padding:16px 12px;overflow-y:auto;z-index:20}
.sidebar .brand{display:flex;gap:10px;align-items:center;padding:4px 6px 14px;border-bottom:1px solid var(--border);margin-bottom:12px}
.sidebar .brand .logo{max-width:44px;max-height:44px}
.sidebar .brand .logo svg{max-width:44px;max-height:44px}
.navbtn{display:block;width:100%;text-align:left;background:none;border:none;padding:10px;border-radius:8px;color:var(--text)}
.navbtn:hover,.navbtn.active{background:var(--surface2)}
.main{margin-left:230px;padding:20px;max-width:1200px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.center-wrap{max-width:430px;margin:6vh auto;padding:0 16px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:50;overflow-y:auto}
.modal .box{background:var(--surface);max-width:640px;margin:4vh auto;border-radius:12px;padding:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.kpi .v{font-size:24px;font-weight:bold}
.chart{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--border)}
.chart>i{flex:1;background:var(--brand);min-height:2px;border-radius:2px 2px 0 0}
@media (max-width:820px){
  .sidebar{position:static;width:auto;border-right:none;border-bottom:1px solid var(--border)}
  .main{margin-left:0;padding:14px}
  .navwrap{display:flex;flex-wrap:wrap;gap:4px}
  .navbtn{width:auto}
  table{font-size:13px}
}
@media print{
  .sidebar,.topbar .actions,.no-print{display:none!important}
  .main{margin:0;max-width:none}
  body{background:#fff;color:#000}
  .card{border:none;padding:0}
}
</style>
